[project]
name = "common-agent-back"
version = "0.1.0"
description = "Back gateway stub: demo auth context and forward to Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.0",
    "websockets>=16.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "pytest>=8.3.5",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.uv.build-backend]
module-name = ["api", "auth", "db", "domain", "services", "settings"]
source-include = [".env.example", "alembic.ini", "config/tools.demo.json"]
