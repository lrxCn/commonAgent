[project]
name = "common-agent-back"
version = "0.1.0"
description = "Back gateway stub: demo auth context and forward to Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "pytest>=8.3.5",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.uv.build-backend]
module-name = ["api", "services", "settings"]
source-include = [".env.example", "config/tools.demo.json"]
