# Local infra for commonAgent (OrbStack / Docker).
# Container names match existing OrbStack setups: my-postgres, qdrant_rag.
#
# If containers already exist, dev.sh starts them instead of recreating.
# POSTGRES_PASSWORD must match agent/.env DATABASE_URL and back/.env AGENT_DATABASE_URL.

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: my-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: common_agent
    ports:
      - "5432:5432"
    volumes:
      - common-agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d common_agent"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_rag
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - common-agent-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  common-agent-postgres-data:
  common-agent-qdrant-data:
