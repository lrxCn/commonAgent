[project]
name = "deep-agent-template"
version = "0.1.0"
description = "Deep Agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.4.0",
    "fastapi>=0.115.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-sdk>=0.1.0",
    "langsmith>=0.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "httpx>=0.28.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires live Postgres at DATABASE_URL",
]

[tool.uv.build-backend]
module-name = ["deep_agent", "gateway", "memory", "settings"]
source-include = ["langgraph.json", ".env.example", "Makefile"]
