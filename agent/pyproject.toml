[project]
name = "deep-agent-template"
version = "0.1.0"
description = "Deep Agent template for LangSmith/LangGraph deployment"
readme = { text = "commonAgent Agent package. See the repository root README.md for architecture, setup, and operating guidance.", content-type = "text/markdown" }
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.4.0",
    "fastapi>=0.115.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-sdk>=0.1.0",
    "langsmith>=0.3.0",
    "mem0ai>=2.0.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.18.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "httpx>=0.28.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
markers = [
    "integration: requires live Postgres at DATABASE_URL",
]

[tool.uv.build-backend]
module-name = ["contracts", "gateway", "graph", "guardrails", "memory", "observability", "rag", "settings"]
source-include = ["langgraph.json", ".env.example", "Makefile"]
